name: release-appstore

on:
  workflow_dispatch:

jobs:
  release_appstore:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install fastlane
        run: gem install fastlane
      - name: Checkout App Store Connect API key
        env:
          APP_STORE_API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/auth"
          if [[ -z "$APP_STORE_API_KEY_BASE64" ]]; then
            echo "Missing APP_STORE_API_KEY_BASE64 secret."
            exit 1
          fi
          echo "$APP_STORE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/auth/AuthKey.p8"
      - name: Run App Store release lane
        env:
          APP_IDENTIFIER: com.albertbuchard.IntrusionIndicator
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_API_KEY_PATH: ${{ runner.temp }}/auth/AuthKey.p8
        run: |
          fastlane release_appstore
